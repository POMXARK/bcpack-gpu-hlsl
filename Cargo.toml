[workspace]
members = [".", "sdk"]

[package]
name = "bcpack-gpu-hlsl"
version = "0.15.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Clean-room Xbox Series BCPack (MDU rANS) GPU Compute Shader decoder & 4K AAA streaming benchmark in DirectX 12 HLSL SM 6.6 (Wave32)"
repository = "https://github.com/POMXARK/bcpack-gpu-hlsl"

[lib]
name = "bcpack_demo"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "bcpack-gpu-demo"
path = "src/main.rs"

[[bin]]
name = "bcpack-demo-cpu"
path = "src/bin/demo_cpu.rs"

[[bin]]
name = "bcpack-demo-gpu"
path = "src/bin/demo_gpu.rs"

[[bin]]
name = "bcpack-aaa-demo"
path = "src/bin/demo_aaa.rs"

[dependencies]
bcpack-gpu-sdk = { path = "sdk" }
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "7b2b42122c6b05787506f212e9a2570999d3f143", default-features = false }
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1.10"
png = "0.18"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
